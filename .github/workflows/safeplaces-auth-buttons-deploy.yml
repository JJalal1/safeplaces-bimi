name: Deploy Safe Places customer launch readiness
on:
  push:
    branches: [feature/auth-speed-seo-before-hosting]
    paths:
      - '.github/workflows/safeplaces-auth-buttons-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safeplaces-production-locked
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/website-validate.yml
  deploy:
    if: github.ref == 'refs/heads/feature/auth-speed-seo-before-hosting'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.25.0'}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile and protect release settings
        run: |
          pnpm run build:production
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const p='dist/server/wrangler.json';
          const c=JSON.parse(readFileSync(p,'utf8'));
          assert.equal(c.name,'safeplaces-production');
          assert.equal(c.vars?.SITE_PUBLIC,'false');
          assert.equal(c.vars?.PRODUCTION_LAUNCH_LOCKED,'true');
          assert.equal(c.vars?.SITE_INDEXABLE,'false');
          assert.equal(c.vars?.EMAIL_NOTIFICATIONS_ENABLED,'false');
          assert.equal(c.vars?.SITE_DEMO_PRICES,'false');
          assert.equal(c.vars?.STANDALONE_AUTH_ENABLED,'true');
          assert.equal(c.vars?.CUSTOMER_AUTH_ENABLED,'false');
          assert.equal(c.vars?.EMAIL_PASSWORD_ENABLED,'true');
          assert.equal(c.vars?.AUTH_EMAIL_FROM,'info@safeplaces.sa');
          // Keep runtime owner/secret bindings out of config; --keep-vars preserves them.
          for(const name of ['STANDALONE_ADMIN_USER_ID','STANDALONE_ADMIN_EMAIL','BETTER_AUTH_SECRET','GOOGLE_CLIENT_SECRET','RESEND_API_KEY'])
            assert.ok(!Object.hasOwn(c.vars,name),'Runtime-managed auth bindings must not be written by the release config');
          assert.deepEqual(c.durable_objects?.bindings,[{name:'AUTH_PASSWORD_HASHER',class_name:'PasswordHasher'}]);
          assert.ok(c.migrations?.some(m=>m.tag==='auth-password-v1'&&m.new_sqlite_classes?.includes('PasswordHasher')));
          assert.equal(c.workers_dev,false);
          assert.equal(c.preview_urls,false);
          assert.ok(!c.route&&!c.routes?.length);
          assert.equal(c.d1_databases?.[0]?.database_id,'da06d822-b7ee-4a14-b3a5-7bcbc5839821');
          assert.equal(c.r2_buckets?.[0]?.bucket_name,'safeplaces-production-private');
          c.vars.PRODUCTION_LAUNCH_LOCKED='false';
          c.vars.SITE_PUBLIC='true';
          c.vars.SITE_INDEXABLE='true';
          c.vars.EMAIL_NOTIFICATIONS_ENABLED='false';
          c.vars.SITE_DEMO_PRICES='false';
          writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          console.log('PASS: public bilingual quote-only site, indexable, no prices or payments');
          NODE
          pnpm exec wrangler deploy --dry-run --keep-vars --config dist/server/wrangler.json
      - name: Verify the exact schema and existing credential names before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b67109c9489a46ae25fb36370c4ba880
        run: node scripts/check-email-auth-release.mjs production
      - name: Deploy verified Google linking and customer launch improvements
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b67109c9489a46ae25fb36370c4ba880
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN="$(node -e "process.stdout.write((process.env.CLOUDFLARE_API_TOKEN || '').replace(/\\s+/g,''))")"
          pnpm exec wrangler deploy --keep-vars --config dist/server/wrangler.json
      - name: Protect authentication diagnostics after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b67109c9489a46ae25fb36370c4ba880
        run: node scripts/check-email-auth-release.mjs production protect-logs
      - name: Verify live customer forms and password RPC without sending mail
        run: node scripts/check-live-email-auth.mjs
      - name: Verify public login labels, SEO and quotation page
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for(const lang of ['ar','en']){
            const r=await fetch('https://safeplaces.sa/'+lang);
            assert.equal(r.status,200);
            const html=await r.text();
            assert.ok(html.includes('Safe Places')||html.includes('SAFE PLACES'));
            const login=await fetch('https://safeplaces.sa/'+lang+'/account/login');
            assert.equal(login.status,200);
            const quote=await fetch('https://safeplaces.sa/'+lang+'/quote');
            assert.equal(quote.status,200);
          }
          const robots=await(await fetch('https://safeplaces.sa/robots.txt')).text();
          assert.ok(robots.includes('Allow: /'));
          const sitemap=await(await fetch('https://safeplaces.sa/sitemap.xml')).text();
          assert.ok(sitemap.includes('https://safeplaces.sa/ar'));
          assert.ok(sitemap.includes('https://safeplaces.sa/en'));
          console.log('PASS: public site/login/quote and bilingual search indexing');
          NODE
