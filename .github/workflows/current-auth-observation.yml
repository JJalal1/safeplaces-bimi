name: Observe current Safe Places auth diagnostics

# Place both .mjs files in .github/diagnostics/current-auth/ and this file in
# .github/workflows/current-auth-observation.yml after review. A matching push
# starts this observation independently of deployment and readback workflows.
# No schedule, workflow_run, pull_request, deployment, or configuration edits.
on:
  push:
    branches:
      - fix/google-login-latest
    paths:
      - '.github/diagnostics/current-auth/observe-current-auth.mjs'
      - '.github/diagnostics/current-auth/observe-current-auth.test.mjs'
      - '.github/workflows/current-auth-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeplaces-current-auth-observation
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'JJalal1/safeplaces-bimi' && github.ref == 'refs/heads/fix/google-login-latest'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify projection and cleanup without network or secret access
        run: node .github/diagnostics/current-auth/observe-current-auth.test.mjs
      - name: Observe fixed auth categories for at most four minutes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/diagnostics/current-auth/observe-current-auth.mjs
      - name: Retain sanitized current observation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-current-observation
          path: auth-current-observation.json
          retention-days: 1
          if-no-files-found: ignore
