name: Website validation
on:
  workflow_call:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-validate.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install dependencies without modifying deployment
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Authentication policy
        run: node scripts/check-standalone-auth-policy.mjs
      - name: Staff authorization policy
        run: node scripts/check-admin-permissions.mjs
      - name: Existing customer auth tests
        run: node scripts/check-customer-auth.mjs
      - name: Protected staging host and Pages gateway
        run: |
          node scripts/check-staging-access.mjs
          node scripts/check-preview-gateway.mjs
      - name: Build
        run: pnpm run build
      - name: Site integration checks
        run: node scripts/check-site.mjs
      - name: Prepare browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/safeplaces-browser" --no-save --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/safeplaces-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Arabic and English pages and persistent guest cart
        run: SAFEPLACES_PLAYWRIGHT_MODULE="$RUNNER_TEMP/safeplaces-browser/node_modules/playwright" node scripts/check-browser.mjs
      - name: Save browser evidence and resolved dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeplaces-verification
          path: |
            website/test-results/
            website/pnpm-lock.yaml
          retention-days: 7
      - name: Cloudflare staging build without deployment
        run: pnpm run build:staging
      - name: Validate staging release bundle without deployment
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
