name: Website validation
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-validate.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install dependencies without modifying deployment
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Authentication policy
        run: node scripts/check-standalone-auth-policy.mjs
      - name: Existing customer auth tests
        run: node scripts/check-customer-auth.mjs
      - name: Build
        run: pnpm run build
      - name: Site integration checks
        run: node scripts/check-site.mjs
