name: Read-only verification of the published Safe Places services
on:
  push:
    branches: [feature/auth-speed-seo-before-hosting]
    paths: ['.github/workflows/safeplaces-current-release-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify the current source and exact published Worker before read-only auditing
        env:
          SAFEPLACES_GITHUB_READ_TOKEN: ${{ github.token }}
          SAFEPLACES_CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const repository='JJalal1/safeplaces-bimi',branch='feature/auth-speed-seo-before-hosting';
          const publishedSource='02d765cf5d684124880792e76ed911f4629ea567';
          const workerVersion='2a27121e-7f31-4d09-99ca-d8a54e5665ea';
          assert.equal(process.env.GITHUB_REPOSITORY,repository);
          const githubHeaders={Authorization:'Bearer '+process.env.SAFEPLACES_GITHUB_READ_TOKEN,Accept:'application/vnd.github+json'};
          async function read(url,headers){const r=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});assert.equal(r.status,200,'Read-only guard request failed');return r.json();}
          const api='https://api.github.com/repos/'+repository;
          const head=await read(api+'/branches/'+branch,githubHeaders);
          assert.equal(head.commit.sha,process.env.GITHUB_SHA,'Only audit the current branch head');
          const comparison=await read(api+'/compare/'+publishedSource+'...'+process.env.GITHUB_SHA,githubHeaders);
          assert.equal(comparison.status,'ahead');
          assert.equal(comparison.files.length,1,'Published application and audit application must be identical');
          assert.equal(comparison.files[0].filename,'.github/workflows/safeplaces-current-release-audit.yml');
          const token=(process.env.SAFEPLACES_CLOUDFLARE_READ_TOKEN||'').replace(/\s+/g,'');assert.ok(token);
          const deployed=await read('https://api.cloudflare.com/client/v4/accounts/b67109c9489a46ae25fb36370c4ba880/workers/scripts/safeplaces-production/deployments?per_page=1',{Authorization:'Bearer '+token});
          assert.equal(deployed.success,true);
          const versions=deployed.result.deployments[0].versions;
          assert.equal(versions.length,1);assert.equal(versions[0].version_id,workerVersion);assert.equal(versions[0].percentage,100);
          const evidence={status:'passed',checkedAt:new Date().toISOString(),readOnly:true,workflowSource:process.env.GITHUB_SHA,publishedSource,workerVersion,applicationFilesUnchanged:true};
          writeFileSync('current-release-guard.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('PASS: fresh current-source audit, unchanged published application and exact live Worker version; no deployment or customer submission');
          NODE
      - name: Save exact release guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeplaces-current-release-guard
          path: current-release-guard.json
          if-no-files-found: ignore
          retention-days: 14
  quality:
    needs: guard
    uses: ./.github/workflows/safeplaces-quality-audit.yml
