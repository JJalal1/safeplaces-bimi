name: Deploy Safe Places production locked

on:
  push:
    branches:
      - feature/auth-speed-seo-before-hosting
    paths:
      - '.github/workflows/safeplaces-production-locked-deploy.yml'
      - 'website/vite.config.ts'
      - 'website/package.json'
      - 'website/wrangler.production.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeplaces-production-locked
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/website-validate.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Build production bundle
        run: pnpm run build:production
      - name: Verify production remains locked
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          for (const path of ['wrangler.production.jsonc','dist/server/wrangler.json']) {
            const c=JSON.parse(readFileSync(path,'utf8'));
            assert.equal(c.name,'safeplaces-production');
            assert.equal(c.vars?.SITE_PUBLIC,'false');
            assert.equal(c.vars?.PRODUCTION_LAUNCH_LOCKED,'true');
            assert.equal(c.vars?.SITE_INDEXABLE,'false');
            assert.equal(c.vars?.STANDALONE_AUTH_ENABLED,'true');
            assert.equal(c.vars?.EMAIL_NOTIFICATIONS_ENABLED,'false');
            assert.equal(c.d1_databases?.[0]?.database_name,'safeplaces-production');
            assert.equal(c.r2_buckets?.[0]?.bucket_name,'safeplaces-production-private');
            assert.equal(c.workers_dev,false);
            assert.equal(c.preview_urls,false);
            assert.ok(!c.route && !c.routes?.length);
          }
          console.log('PASS: production bundle is isolated, auth-ready, and unrouted.');
          NODE
      - name: Dry run
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
      - name: Deploy production Worker without domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b67109c9489a46ae25fb36370c4ba880
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN="$(node -e "process.stdout.write((process.env.CLOUDFLARE_API_TOKEN || '').replace(/\\s+/g,''))")"
          pnpm exec wrangler deploy --config dist/server/wrangler.json
