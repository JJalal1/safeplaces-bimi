name: Read production configuration after Google login repair
on:
  push:
    branches: [fix/google-login-latest]
    paths:
      - .github/diagnostics/post-deploy/check-google-post-deploy-readback.mjs
      - .github/diagnostics/post-deploy/check-google-post-deploy-readback.test.mjs
      - .github/workflows/safeplaces-google-post-deploy-readback.yml
permissions:
  contents: read
concurrency:
  group: safeplaces-google-post-deploy-readback
  cancel-in-progress: false
jobs:
  readback:
    if: github.repository == 'JJalal1/safeplaces-bimi' && github.ref == 'refs/heads/fix/google-login-latest' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact request boundaries and private-data projection offline
        run: |
          node --check .github/diagnostics/post-deploy/check-google-post-deploy-readback.mjs
          node .github/diagnostics/post-deploy/check-google-post-deploy-readback.test.mjs
      - name: Read only the production deployment and settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/diagnostics/post-deploy/check-google-post-deploy-readback.mjs
      - name: Save sanitized readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-post-deploy-readback
          path: google-post-deploy-readback.json
          if-no-files-found: error
          retention-days: 3
