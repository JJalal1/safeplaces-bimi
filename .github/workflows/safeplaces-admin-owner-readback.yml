name: Read Safe Places owner binding formats once
on:
  push:
    branches: [fix/google-login-latest]
    paths:
      - '.github/workflows/safeplaces-admin-owner-readback.yml'
      - '.github/diagnostics/admin-owner/**'
permissions:
  contents: read
concurrency:
  group: safeplaces-admin-owner-format-readback
  cancel-in-progress: false
jobs:
  read-owner-binding-formats:
    if: github.repository == 'JJalal1/safeplaces-bimi' && github.ref == 'refs/heads/fix/google-login-latest' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the exact reviewed identity policy before using the existing token
        shell: bash
        run: |
          set -euo pipefail
          policy_blob=$(git rev-parse 'HEAD:website/lib/standalone-auth-policy.ts')
          test "$policy_blob" = 'e8c4267191f4fd5c25da666928212f9af4a16cbc'
          printf '%s\n' "SAFEPLACES_OWNER_POLICY_BLOB=$policy_blob" >> "$GITHUB_ENV"
      - name: Verify scope and privacy entirely offline
        run: node .github/diagnostics/admin-owner/read-owner-binding-formats.test.mjs
      - name: Read only deployment identity and owner binding format flags
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/diagnostics/admin-owner/read-owner-binding-formats.mjs
