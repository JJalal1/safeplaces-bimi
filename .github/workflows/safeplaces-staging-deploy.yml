name: Deploy Safe Places staging (manual only)
on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: "Type safeplaces-staging to confirm that you are NOT deploying production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: safeplaces-staging-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ github.ref == 'refs/heads/feature/auth-speed-seo-before-hosting' && inputs.confirm_staging_only == 'safeplaces-staging' }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Validate TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Build isolated staging bundle
        run: pnpm run build:staging
      - name: Check Cloudflare bundle before deployment
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
      - name: Ensure Cloudflare deployment token exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the token as a GitHub staging environment secret. Never commit it."
            exit 1
          fi
      - name: Deploy staging Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
